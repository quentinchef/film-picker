<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Films vus · import Letterboxd</title>
<style>
:root{--bg:#14181c;--bar:#1c2228;--panel:#1a2026;--tx:#e4e8eb;--mu:#8a96a0;--ok:#40bcf4;--ac:#ff8000;--bd:#2c3640}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,sans-serif}
header{position:sticky;top:0;z-index:20;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:var(--bar);border-bottom:1px solid var(--bd)}
header b{font-size:15px;white-space:nowrap}
#hint{flex:1;min-width:180px;padding:7px 10px;border-radius:4px;border:1px solid #3a4651;background:var(--bg);color:var(--tx)}
button{padding:7px 12px;border:0;border-radius:4px;background:#2c3640;color:var(--tx);font:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
button:hover{background:#3a4651}
#next{background:var(--ac);color:#111;font-weight:600}
#next:disabled{opacity:.5;cursor:wait}
#toggle-sidebar{background:#23323f}

.layout{display:flex;min-height:calc(100vh - 53px)}
aside{width:290px;min-width:260px;background:var(--panel);border-right:1px solid var(--bd);padding:14px;display:flex;flex-direction:column;gap:12px}
aside h3{margin:0;font-size:14px;text-transform:uppercase;letter-spacing:.5px;color:var(--mu);display:flex;justify-content:space-between;align-items:center}
.pill-list{display:flex;flex-direction:column;gap:8px;overflow-y:auto;max-height:calc(100vh - 160px)}
.sug-card{background:#232b33;border:1px solid #2f3a46;border-radius:6px;padding:9px 11px;cursor:pointer;transition:border-color .15s,background .15s;text-align:left}
.sug-card:hover{background:#2a343e;border-color:var(--ok)}
.sug-card b{display:block;color:var(--tx);font-size:13px;margin-bottom:3px}
.sug-card span{display:block;font-size:11px;color:var(--mu)}
.sug-card.active{border-color:var(--ac);background:#2c2820}

.content{flex:1;display:flex;flex-direction:column}
#perf{padding:6px 16px;color:var(--mu);font-size:12px;background:#111417;border-bottom:1px solid #1e242a}
#msg{padding:20px;text-align:center;color:var(--mu)}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;padding:16px;flex:1}
.c{position:relative;aspect-ratio:2/3;border-radius:4px;overflow:hidden;background:#222b33;cursor:pointer;outline:2px solid transparent;outline-offset:-2px}
.c img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .15s}
.c.sel{outline-color:var(--ok)}
.c.sel img{opacity:.45}
.c.sel::after{content:"✓ vu";position:absolute;top:6px;right:6px;background:var(--ok);color:#111;font-weight:700;font-size:11px;padding:2px 6px;border-radius:3px}
.c span{position:absolute;left:0;right:0;bottom:0;padding:16px 6px 4px;font-size:11px;background:linear-gradient(transparent,#000c)}
.wl{position:absolute;top:6px;left:6px;padding:2px 6px;font-size:10px;background:#000b;border-radius:3px;border:0;color:#fff}
.c.w{outline-color:var(--ac)}
.c.w img{opacity:.6}
.c.w .wl{background:var(--ac);color:#111;font-weight:700}
.c.sel .wl{display:none}

/* Modal Clés */
.modal-backdrop{position:fixed;top:0;left:0;width:100%;height:100%;background:#0009;display:none;align-items:center;justify-content:center;z-index:100}
.modal{background:var(--panel);border:1px solid var(--bd);padding:20px;border-radius:6px;max-width:400px;width:90%}
.modal h3{margin-top:0}
.modal label{display:block;margin:10px 0 4px;font-size:12px;color:var(--mu)}
.modal input{width:100%;padding:8px;border-radius:4px;border:1px solid #3a4651;background:var(--bg);color:var(--tx)}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}

@media(max-width:850px){
  aside{position:fixed;bottom:0;top:53px;left:0;z-index:30;box-shadow:4px 0 15px #000a;transform:translateX(-100%);transition:transform .2s}
  aside.open{transform:translateX(0)}
}
</style>
</head>
<body>

<header>
  <button id="toggle-sidebar">🎯 Suggestions</button>
  <b><span id="n">0</span> vus · <span id="w">0</span> à voir</b>
  <button id="next">Grille suivante</button>
  <input id="hint" placeholder="Tapez un réalisateur, acteur ou mot-clé (« Spielberg », « Kubrick »…)">
  <button id="ask" style="background:#2c5f7a">Chercher</button>
  <button id="all">Tout cocher</button>
  <button id="csv">Export vus</button>
  <button id="wcsv">Watchlist</button>
  <button id="sav">Sauvegarder</button>
  <button id="load">Charger</button>
  <input type="file" id="file" accept=".json,.csv" style="display:none">
  <button id="cfg">Clés</button>
  <button id="rst">Reset</button>
</header>

<div class="layout">
  <aside id="sidebar">
    <h3>
      <span>Suggestions ciblées</span>
      <button id="gen-facets" style="padding:2px 6px;font-size:11px">↻ Relancer</button>
    </h3>
    <div style="font-size:11px;color:var(--mu)">
      Filtres d'exploration TMDB 100% exhaustifs.
    </div>
    <div class="pill-list" id="suggestions-container">
      <div style="color:var(--mu);font-size:12px">Chargement...</div>
    </div>
  </aside>

  <div class="content">
    <div id="perf"></div>
    <div id="msg"></div>
    <main id="grid"></main>
  </div>
</div>

<div id="modal-cfg" class="modal-backdrop">
  <div class="modal">
    <h3>Configuration des clés API</h3>
    <label for="key-gemini">Clé Gemini (aistudio.google.com/apikey)</label>
    <input type="password" id="key-gemini" placeholder="AIzaSy...">
    
    <label for="key-tmdb">Clé TMDB v3 (themoviedb.org/settings/api)</label>
    <input type="password" id="key-tmdb" placeholder="Clé API TMDB">
    
    <div class="modal-actions">
      <button id="cfg-cancel">Annuler</button>
      <button id="cfg-save" style="background:var(--ok);color:#111;font-weight:600">Enregistrer</button>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const MODELS = ['gemini-2.5-flash', 'gemini-3.5-flash', 'gemini-3.5-flash-lite'];
const N = 50;

const TMDB_GENRES = {
  "action": 28, "aventure": 12, "animation": 16, "comédie": 35, "crime": 80,
  "documentaire": 99, "drame": 18, "famille": 10751, "fantastique": 14, "histoire": 36,
  "horreur": 27, "musique": 10402, "mystère": 9648, "romance": 10749, "science-fiction": 878,
  "téléfilm": 10770, "thriller": 53, "guerre": 10752, "western": 37
};

const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) || d } catch { return d } };
let S = load('lb_state', { seen: {}, unseen: {}, watch: {} });
if (!S.watch) S.watch = {};
if (!S.seen) S.seen = {};
if (!S.unseen) S.unseen = {};

let keys = load('lb_keys', { a: '', t: '' });
let grid = [];
let activeMode = null; // { type: 'person'|'discover', buffer: [], total: 0, label: '' }

const save = () => {
  localStorage.lb_state = JSON.stringify(S);
  $('#n').textContent = Object.keys(S.seen).length;
  $('#w').textContent = Object.keys(S.watch).length;
};

function openKeyModal() {
  $('#key-gemini').value = keys.a || '';
  $('#key-tmdb').value = keys.t || '';
  $('#modal-cfg').style.display = 'flex';
}
function closeKeyModal() { $('#modal-cfg').style.display = 'none'; }
$('#cfg').addEventListener('click', openKeyModal);
$('#cfg-cancel').addEventListener('click', closeKeyModal);
$('#cfg-save').addEventListener('click', () => {
  keys.a = $('#key-gemini').value.trim();
  keys.t = $('#key-tmdb').value.trim();
  localStorage.lb_keys = JSON.stringify(keys);
  closeKeyModal();
  $('#msg').textContent = 'Clés enregistrées avec succès.';
  if (keys.a && keys.t) {
    loadLLMSuggestions();
    if (!grid.length) nextClassic();
  }
});

function hasKeys() {
  if (!keys.a || !keys.t) {
    openKeyModal();
    $('#msg').textContent = 'Veuillez renseigner vos clés pour continuer.';
    return false;
  }
  return true;
}

$('#load').addEventListener('click', () => { $('#file').value = ''; $('#file').click(); });
