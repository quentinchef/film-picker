<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Films vus · Letterboxd Picker</title>
<style>
:root{--bg:#14181c;--bar:#1c2228;--panel:#1a2026;--tx:#e4e8eb;--mu:#8a96a0;--ok:#40bcf4;--ac:#ff8000;--bd:#2c3640;--bad:#ff4d4d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;z-index:30;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 12px;background:var(--bar);border-bottom:1px solid var(--bd)}
header b{font-size:13px;white-space:nowrap}
#hint{flex:1;min-width:160px;padding:7px 10px;border-radius:4px;border:1px solid #3a4651;background:var(--bg);color:var(--tx)}
button{padding:7px 11px;border:0;border-radius:4px;background:#2c3640;color:var(--tx);font:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:5px;font-size:13px}
button:hover{background:#3a4651}
#next{background:var(--ac);color:#111;font-weight:600}
#next:disabled{opacity:.5;cursor:wait}
.nav-tab{background:transparent;border:1px solid var(--bd)}
.nav-tab.active{background:#23323f;border-color:var(--ok);color:var(--ok);font-weight:600}

.layout{display:flex;min-height:calc(100vh - 49px);position:relative}
aside{width:290px;min-width:260px;background:var(--panel);border-right:1px solid var(--bd);padding:14px;display:flex;flex-direction:column;gap:12px;z-index:40}
aside h3{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--mu);display:flex;justify-content:space-between;align-items:center}
.pill-list{display:flex;flex-direction:column;gap:8px;overflow-y:auto;max-height:calc(100vh - 160px)}
.sug-card{background:#232b33;border:1px solid #2f3a46;border-radius:6px;padding:8px 10px;cursor:pointer;transition:border-color .15s,background .15s;text-align:left}
.sug-card:hover{background:#2a343e;border-color:var(--ok)}
.sug-card b{display:block;color:var(--tx);font-size:13px;margin-bottom:2px}
.sug-card span{display:block;font-size:11px;color:var(--mu)}
.sug-card.active{border-color:var(--ac);background:#2c2820}

#sidebar-backdrop{display:none;position:fixed;top:49px;left:0;right:0;bottom:0;background:#0008;z-index:35}

.content{flex:1;display:flex;flex-direction:column}
#perf{padding:6px 14px;color:var(--mu);font-size:12px;background:#111417;border-bottom:1px solid #1e242a;min-height:28px}
#msg{padding:12px;text-align:center;color:var(--mu);font-size:13px}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:10px;padding:12px;flex:1;align-content:start}

.c{position:relative;aspect-ratio:2/3;border-radius:4px;overflow:hidden;background:#222b33;cursor:pointer;outline:2px solid transparent;outline-offset:-2px}
.c img{width:100%;height:100%;object-fit:cover;display:block;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.c.sel{outline-color:var(--ok)}
.c.sel img{opacity:.4}
.c.sel::after{content:"✓ vu";position:absolute;top:6px;right:6px;background:var(--ok);color:#111;font-weight:700;font-size:11px;padding:2px 6px;border-radius:3px}
.c span{position:absolute;left:0;right:0;bottom:0;padding:16px 6px 4px;font-size:11px;background:linear-gradient(transparent,#000c);pointer-events:none}
.wl{position:absolute;top:6px;left:6px;padding:3px 6px;font-size:10px;background:#000b;border-radius:3px;border:0;color:#fff}
.c.w{outline-color:var(--ac)}
.c.w img{opacity:.55}
.c.w .wl{background:var(--ac);color:#111;font-weight:700}
.c.sel .wl{display:none}

.btn-info{position:absolute;bottom:6px;right:6px;background:#0009;border:0;color:#fff;border-radius:50%;width:24px;height:24px;padding:0;font-size:12px;display:flex;align-items:center;justify-content:center;z-index:5}
.btn-info:hover{background:var(--ok);color:#111}

/* Gestionnaire de liste */
#list-view{display:none;padding:14px;flex:1;flex-direction:column;gap:12px}
.list-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--panel);padding:10px;border-radius:6px;border:1px solid var(--bd)}
.list-toolbar input, .list-toolbar select{padding:6px 10px;border-radius:4px;border:1px solid #3a4651;background:var(--bg);color:var(--tx);font:inherit}
.list-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.list-item{background:#222b33;border-radius:4px;overflow:hidden;border:1px solid var(--bd);display:flex;flex-direction:column}
.list-item img{width:100%;aspect-ratio:2/3;object-fit:cover;cursor:pointer;background:#181f26;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.list-item-body{padding:6px;display:flex;flex-direction:column;gap:4px;flex:1;justify-content:space-between}
.list-item-title{font-size:11px;font-weight:600;line-height:1.2}
.list-item-sub{font-size:10px;color:var(--mu)}
.list-item-actions{display:flex;gap:4px;margin-top:4px}
.list-item-actions button{flex:1;padding:4px;font-size:10px;justify-content:center}

/* Modales */
.modal-backdrop{position:fixed;top:0;left:0;width:100%;height:100%;background:#000a;display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:var(--panel);border:1px solid var(--bd);padding:18px;border-radius:6px;max-width:440px;width:100%;max-height:88vh;overflow-y:auto}
.modal h3{margin-top:0}
.modal label{display:block;margin:10px 0 4px;font-size:12px;color:var(--mu)}
.modal input{width:100%;padding:8px;border-radius:4px;border:1px solid #3a4651;background:var(--bg);color:var(--tx)}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}

/* Fiche film */
.movie-details{display:flex;gap:14px}
.movie-details img{width:100px;aspect-ratio:2/3;object-fit:cover;border-radius:4px}
.movie-details-info{flex:1;display:flex;flex-direction:column;gap:4px}
.movie-details-info b{font-size:15px}
.movie-details-info .meta{font-size:12px;color:var(--mu)}
.movie-details-info p{font-size:12px;margin:8px 0 0;line-height:1.4;color:#ccd3d8;max-height:180px;overflow-y:auto}

@media(max-width:850px){
  aside{position:fixed;bottom:0;top:49px;left:0;box-shadow:4px 0 15px #000a;transform:translateX(-100%);transition:transform .2s;width:85%;max-width:320px}
  aside.open{transform:translateX(0)}
  #sidebar-backdrop.open{display:block}
}
</style>
</head>
<body>

<header>
  <button id="toggle-sidebar">🎯 Suggestions</button>
  <button id="tab-explore" class="nav-tab active">Explorer</button>
  <button id="tab-seen" class="nav-tab"><span id="n">0</span> vus</button>
  <button id="tab-watch" class="nav-tab"><span id="w">0</span> à voir</button>
  <button id="next">Grille suivante</button>
  <input id="hint" placeholder="« film français 2000s », « Nolan », « horreur coréenne »…">
  <button id="ask" style="background:#2c5f7a">Chercher</button>
  <button id="all">Tout cocher</button>
  <button id="sync-push" title="Sauvegarder sur GitHub Gist">☁️ Sauver</button>
  <button id="sync-pull" title="Charger depuis GitHub Gist">☁️ Charger</button>
  <button id="cfg">⚙️</button>
</header>

<div id="sidebar-backdrop"></div>

<div class="layout">
  <aside id="sidebar">
    <h3>
      <span>Suggestions ciblées</span>
      <div style="display:flex;gap:4px">
        <button id="gen-facets" style="padding:2px 6px;font-size:11px">↻</button>
        <button id="close-sidebar" style="padding:2px 6px;font-size:11px">✕</button>
      </div>
    </h3>
    <div style="font-size:11px;color:var(--mu)">
      Filtres d'exploration TMDB exhaustifs.
    </div>
    <div class="pill-list" id="suggestions-container">
      <div style="color:var(--mu);font-size:12px">Chargement...</div>
    </div>
  </aside>

  <div class="content">
    <div id="perf"></div>
    <div id="msg"></div>
    <main id="grid"></main>

    <!-- Gestion des listes -->
    <div id="list-view">
      <div class="list-toolbar">
        <input type="text" id="list-search" placeholder="Rechercher par titre...">
        <select id="list-decade">
          <option value="">Toutes époques</option>
          <option value="2020">Années 2020</option>
          <option value="2010">Années 2010</option>
          <option value="2000">Années 2000</option>
          <option value="1990">Années 1990</option>
          <option value="1980">Années 1980</option>
          <option value="1970">Années 1970</option>
          <option value="old">Avant 1970</option>
        </select>
        <select id="list-sort">
          <option value="date-desc">Récents d'abord</option>
          <option value="year-desc">Année (récent → ancien)</option>
          <option value="year-asc">Année (ancien → récent)</option>
          <option value="alpha">Titre (A → Z)</option>
        </select>
      </div>
      <div class="list-grid" id="list-cards"></div>
    </div>
  </div>
</div>

<!-- Modale Fiche Détail Film -->
<div id="modal-movie" class="modal-backdrop">
  <div class="modal">
    <div class="movie-details" id="movie-details-content"></div>
    <div class="modal-actions">
      <button id="modal-movie-close">Fermer</button>
    </div>
  </div>
</div>

<!-- Modale Configuration -->
<div id="modal-cfg" class="modal-backdrop">
  <div class="modal">
    <h3>Configuration & Sauvegardes</h3>
    <label for="key-gemini">Clé Gemini API (aistudio.google.com)</label>
    <input type="password" id="key-gemini" placeholder="AIzaSy...">
    
    <label for="key-tmdb">Clé TMDB API v3 (themoviedb.org)</label>
    <input type="password" id="key-tmdb" placeholder="Clé API TMDB">

    <label for="cfg-gist-id">GitHub Gist ID</label>
    <input type="text" id="cfg-gist-id">

    <label for="cfg-gh-token">GitHub Personal Access Token (classic)</label>
    <input type="password" id="cfg-gh-token" placeholder="ghp_...">

    <hr style="border:0;border-top:1px solid var(--bd);margin:16px 0">
    <div style="font-size:12px;color:var(--mu);margin-bottom:8px">Sauvegardes de secours locales :</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap">
      <button id="btn-export-csv">Exporter CSV (Letterboxd)</button>
      <button id="btn-export-json">Télécharger JSON</button>
      <button id="btn-import-file">Importer fichier (CSV/JSON)</button>
      <input type="file" id="file-input" accept=".json,.csv" style="display:none">
    </div>

    <div class="modal-actions" style="margin-top:20px">
      <button id="btn-reset-all" style="background:var(--bad);color:#fff">Réinitialiser tout</button>
      <button id="cfg-cancel">Annuler</button>
      <button id="cfg-save" style="background:var(--ok);color:#111;font-weight:600">Enregistrer</button>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const MODELS = ['gemini-2.5-flash', 'gemini-3.5-flash', 'gemini-3.5-flash-lite'];

const TMDB_GENRES = {
  "action": 28, "aventure": 12, "animation": 16, "comédie": 35, "comedie": 35,
  "crime": 80, "policier": 80, "documentaire": 99, "drame": 18, "famille": 10751,
  "fantastique": 14, "histoire": 36, "horreur": 27, "musique": 10402, "mystère": 9648,
  "mystere": 9648, "romance": 10749, "science-fiction": 878, "sf": 878,
  "téléfilm": 10770, "thriller": 53, "guerre": 10752, "western": 37
};

const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) || d } catch { return d } };
let S = load('lb_state', { seen: {}, unseen: {}, watch: {} });
if (!S.watch) S.watch = {};
if (!S.seen) S.seen = {};
if (!S.unseen) S.unseen = {};

let keys = load('lb_keys', {
  a: '',
  t: '',
  gistId: '5e86dd50fed7f7284e320c81689dba94',
  ghToken: ''
});

let grid = [];
let currentView = 'explore';

// État de la navigation courante (pour pagination continue sans interruption)
let browseState = {
  mode: 'general', // 'general', 'discover', 'person'
  page: 1,
  label: 'Grille générale',
  discoverParams: null,
  personBuffer: []
};

function getPosterSrc(film) {
  if (film.p) return `https://image.tmdb.org/t/p/w342${film.p}`;
  if (keys.t) {
    fetch(`https://api.themoviedb.org/3/movie/${film.id}?api_key=${keys.t}`)
      .then(r => r.json())
      .then(d => {
        if (d.poster_path) {
          film.p = d.poster_path;
          save();
          const el = document.getElementById(`img-${film.id}`);
          if (el) el.src = `https://image.tmdb.org/t/p/w342${d.poster_path}`;
        }
      }).catch(() => {});
  }
  return 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="140" height="210" viewBox="0 0 140 210"><rect width="140" height="210" fill="%23222b33"/><text x="50%25" y="50%25" dominant-baseline="middle" text-anchor="middle" fill="%238a96a0" font-family="sans-serif" font-size="11">Chargement...</text></svg>';
}

function computeScreenBatchSize() {
  const w = window.innerWidth;
  const h = window.innerHeight - 100;
  const cols = Math.max(2, Math.floor(w / 135));
  const rows = Math.max(2, Math.ceil(h / 205));
  return Math.min(100, Math.max(24, cols * rows));
}

const save = () => {
  localStorage.lb_state = JSON.stringify(S);
  $('#n').textContent = Object.keys(S.seen).length;
  $('#w').textContent = Object.keys(S.watch).length;
};

// ----------------- SIDEBAR MOBILE -----------------

function closeSidebar() {
  $('#sidebar').classList.remove('open');
  $('#sidebar-backdrop').classList.remove('open');
}
function toggleSidebar() {
  const isOpen = $('#sidebar').classList.toggle('open');
  $('#sidebar-backdrop').classList.toggle('open', isOpen);
}
$('#toggle-sidebar').onclick = toggleSidebar;
$('#close-sidebar').onclick = closeSidebar;
$('#sidebar-backdrop').onclick = closeSidebar;

// ----------------- MODALE DÉTAILS FILM -----------------

async function showMovieDetails(filmId) {
  $('#movie-details-content').innerHTML = '<div style="color:var(--mu);font-size:12px">Chargement TMDB...</div>';
  $('#modal-movie').style.display = 'flex';

  try {
    const q = `https://api.themoviedb.org/3/movie/${filmId}?api_key=${keys.t}&language=fr-FR&append_to_response=credits`;
    const res = await (await fetch(q)).json();
    
    const directors = (res.credits?.crew || []).filter(c => c.job === 'Director').map(c => c.name).join(', ') || 'Inconnu';
    const actors = (res.credits?.cast || []).slice(0, 4).map(c => c.name).join(', ') || 'Non renseigné';
    const genres = (res.genres || []).map(g => g.name).join(', ');

    $('#movie-details-content').innerHTML = `
      <img src="${res.poster_path ? 'https://image.tmdb.org/t/p/w342' + res.poster_path : ''}" alt="">
      <div class="movie-details-info">
        <b>${res.title} (${(res.release_date || '').slice(0, 4)})</b>
        <div class="meta">${res.original_title !== res.title ? res.original_title + ' · ' : ''}⭐ ${res.vote_average ? res.vote_average.toFixed(1) : '—'}/10 (${res.vote_count} votes)</div>
        <div class="meta" style="margin-top:2px">🎬 ${directors}</div>
        <div class="meta">🎭 ${actors}</div>
        <div class="meta">🏷️ ${genres}</div>
        <p>${res.overview || 'Aucun synopsis disponible pour ce film.'}</p>
      </div>
    `;
  } catch(e) {
    $('#movie-details-content').innerHTML = `<div style="color:var(--bad)">Erreur : ${e.message}</div>`;
  }
}
$('#modal-movie-close').onclick = () => $('#modal-movie').style.display = 'none';

// ----------------- SYNCHRONISATION GITHUB GIST -----------------

async function pushToGist() {
  if (!keys.gistId || !keys.ghToken) {
    openKeyModal();
    return alert('Renseigne ton Gist ID et ton Token GitHub dans les réglages (⚙️).');
  }
  record();
  $('#perf').textContent = '☁️ Sauvegarde Gist en cours...';
  try {
    const res = await fetch(`https://api.github.com/gists/${keys.gistId}`, {
      method: 'PATCH',
      headers: {
        'Accept': 'application/vnd.github+json',
        'Authorization': `Bearer ${keys.ghToken}`
      },
      body: JSON.stringify({
        files: { 'session-films.json': { content: JSON.stringify(S) } }
      })
    });
    if (!res.ok) throw new Error(`Erreur ${res.status}`);
    $('#perf').textContent = `☁️ Synchronisé avec succès (${new Date().toLocaleTimeString()})`;
  } catch(e) {
    alert('Erreur Gist : ' + e.message);
    $('#perf').textContent = 'Échec de sauvegarde Gist.';
  }
}

async function pullFromGist() {
  if (!keys.gistId || !keys.ghToken) {
    openKeyModal();
    return alert('Renseigne ton Gist ID et ton Token GitHub dans les réglages (⚙️).');
  }
  $('#perf').textContent = '☁️ Téléchargement depuis GitHub Gist...';
  try {
    const res = await fetch(`https://api.github.com/gists/${keys.gistId}`, {
      headers: {
        'Accept': 'application/vnd.github+json',
        'Authorization': `Bearer ${keys.ghToken}`
      }
    });
    if (!res.ok) throw new Error(`Erreur ${res.status}`);
    const data = await res.json();
    const content = data.files['session-films.json']?.content;
    if (content) {
      const parsed = JSON.parse(content);
      S = { seen: parsed.seen || {}, unseen: parsed.unseen || {}, watch: parsed.watch || {} };
      save();
      if (currentView === 'explore') renderGrid();
      else renderListView();
      $('#perf').textContent = `☁️ Données Gist chargées : ${Object.keys(S.seen).length} vus, ${Object.keys(S.watch).length} à voir.`;
    }
  } catch(e) {
    alert('Erreur chargement Gist : ' + e.message);
  }
}

// ----------------- CONFIG & REGLAGES -----------------

function openKeyModal() {
  $('#key-gemini').value = keys.a || '';
  $('#key-tmdb').value = keys.t || '';
  $('#cfg-gist-id').value = keys.gistId || '';
  $('#cfg-gh-token').value = keys.ghToken || '';
  $('#modal-cfg').style.display = 'flex';
}
function closeKeyModal() { $('#modal-cfg').style.display = 'none'; }
$('#cfg').onclick = openKeyModal;
$('#cfg-cancel').onclick = closeKeyModal;
$('#cfg-save').onclick = () => {
  keys.a = $('#key-gemini').value.trim();
  keys.t = $('#key-tmdb').value.trim();
  keys.gistId = $('#cfg-gist-id').value.trim();
  keys.ghToken = $('#cfg-gh-token').value.trim();
  localStorage.lb_keys = JSON.stringify(keys);
  closeKeyModal();
  $('#msg').textContent = 'Réglages enregistrés.';
  if (keys.a && keys.t && !grid.length) {
    loadLLMSuggestions();
    fetchNextBatch();
  }
};

function hasKeys() {
  if (!keys.a || !keys.t) {
    openKeyModal();
    $('#msg').textContent = 'Renseigne tes clés Gemini et TMDB pour continuer.';
    return false;
  }
  return true;
}

// ----------------- MOTEUR TMDB EXHAUSTIF -----------------

async function searchPerson(name) {
  const q = `https://api.themoviedb.org/3/search/person?api_key=${keys.t}&query=${encodeURIComponent(name)}&language=fr-FR`;
  const j = await (await fetch(q)).json();
  return j.results?.[0] || null;
}

async function fetchPersonCredits(personId, role = 'director') {
  const q = `https://api.themoviedb.org/3/person/${personId}/movie_credits?api_key=${keys.t}&language=fr-FR`;
  const data = await (await fetch(q)).json();
  let list = [];

  if (role === 'director') {
    const raw = (data.crew || []).filter(c => c.job === 'Director');
    const seen = new Set();
    for (const m of raw) {
      if (!seen.has(m.id)) { seen.add(m.id); list.push(m); }
    }
  } else {
    list = data.cast || [];
  }

  list.sort((a, b) => (b.vote_count || 0) - (a.vote_count || 0));

  return list.map(m => ({
    id: m.id,
    t: m.title || m.original_title,
    o: m.original_title,
    y: (m.release_date || '').slice(0, 4) || '—',
    p: m.poster_path
  })).filter(m => m.p);
}

// Interrogation paginée TMDB Discover : parcourt autant de pages que nécessaire jusqu'à remplir le quota
async function fetchDiscoverBatch(params, targetCount) {
  const out = [];
  const known = id => S.seen[id] || S.unseen[id] || S.watch[id];
  let page = browseState.page || 1;
  let emptyPages = 0;

  while (out.length < targetCount && page <= 100 && emptyPages < 5) {
    const url = new URL('https://api.themoviedb.org/3/discover/movie');
    url.searchParams.set('api_key', keys.t);
    url.searchParams.set('language', 'fr-FR');
    url.searchParams.set('sort_by', 'vote_count.desc');
    url.searchParams.set('include_adult', 'false');
    url.searchParams.set('page', page);

    if (params) {
      if (params.with_genres) url.searchParams.set('with_genres', params.with_genres);
      if (params.with_origin_country) url.searchParams.set('with_origin_country', params.with_origin_country);
      if (params.year_gte) url.searchParams.set('primary_release_date.gte', `${params.year_gte}-01-01`);
      if (params.year_lte) url.searchParams.set('primary_release_date.lte', `${params.year_lte}-12-31`);
    }

    const res = await (await fetch(url.toString())).json();
    if (!res.results || !res.results.length) {
      emptyPages++;
      break;
    }

    for (const m of res.results) {
      if (m.poster_path && !known(m.id) && !out.some(f => f.id === m.id)) {
        out.push({
          id: m.id,
          t: m.title || m.original_title,
          o: m.original_title,
          y: (m.release_date || '').slice(0, 4) || '—',
          p: m.poster_path
        });
      }
      if (out.length >= targetCount) break;
    }
    page++;
  }

  browseState.page = page;
  return out;
}

// ----------------- CHARGEMENT DU BATCH SUIVANT -----------------

async function fetchNextBatch() {
  if (!hasKeys()) return;
  switchToExplore();
  record();

  const count = computeScreenBatchSize();
  $('#msg').textContent = `Chargement (${browseState.label})...`;

  let out = [];
  const known = id => S.seen[id] || S.unseen[id] || S.watch[id];

  if (browseState.mode === 'person') {
    while (browseState.personBuffer.length && out.length < count) {
      const f = browseState.personBuffer.shift();
      if (!known(f.id) && !out.some(o => o.id === f.id)) out.push(f);
    }
  } else {
    // general ou discover
    out = await fetchDiscoverBatch(browseState.discoverParams, count);
  }

  grid = out;
  renderGrid();
  $('#perf').textContent = `${browseState.label} · ${grid.length} affiches affichées`;
  $('#msg').textContent = grid.length ? '' : 'Plus aucun nouveau film disponible pour ce filtre.';
  scrollTo(0, 0);
}

// ----------------- RECHERCHE INTELLIGENTE PAR INTERPRÉTATION LLM -----------------

async function parseSearchIntent(text) {
  const system = `Tu es un parseur strict pour l'API TMDB discover/movie.
Analyse la requête utilisateur et renvoie UNIQUEMENT un objet JSON avec cette structure :
{
  "is_person": boolean,
  "person_name": string ou null,
  "person_role": "director" ou "actor",
  "with_origin_country": string (code ISO 2 lettres: FR, US, KR, JP, IT, GB, ES, HK, etc.) ou null,
  "genres": tableau parmi [action, aventure, animation, comédie, crime, documentaire, drame, famille, fantastique, histoire, horreur, musique, mystère, romance, science-fiction, thriller, guerre, western],
  "year_gte": number ou null,
  "year_lte": number ou null,
  "literal_title": string ou null (si c'est clairement un titre de film précis)
}`;

  const prompt = `Requête : "${text}"`;
  const res = await callGemini(system, prompt, 0.2);
  return res;
}

$('#ask').onclick = async () => {
  const query = $('#hint').value.trim();
  if (!query || !hasKeys()) return;
  switchToExplore();
  record();
  $('#msg').textContent = `Analyse et recherche TMDB pour "${query}"...`;

  try {
    const parsed = await parseSearchIntent(query);

    // 1. Si c'est un réalisateur ou acteur identifié
    if (parsed.is_person && parsed.person_name) {
      const person = await searchPerson(parsed.person_name);
      if (person) {
        const isDir = parsed.person_role === 'director' || person.known_for_department === 'Directing';
        const credits = await fetchPersonCredits(person.id, isDir ? 'director' : 'actor');
        browseState = {
          mode: 'person',
          label: `${person.name} (${isDir ? 'Réalisateur' : 'Acteur'})`,
          personBuffer: credits
        };
        fetchNextBatch();
        return;
      }
    }

    // 2. Si c'est un titre de film précis
    if (parsed.literal_title && !parsed.with_origin_country && !parsed.year_gte && (!parsed.genres || !parsed.genres.length)) {
      const q = `https://api.themoviedb.org/3/search/movie?api_key=${keys.t}&query=${encodeURIComponent(parsed.literal_title)}&language=fr-FR`;
      const res = await (await fetch(q)).json();
      const known = id => S.seen[id] || S.unseen[id] || S.watch[id];
      grid = (res.results || [])
        .filter(m => m.poster_path && !known(m.id))
        .map(m => ({ id: m.id, t: m.title, o: m.original_title, y: (m.release_date || '').slice(0, 4) || '—', p: m.poster_path }));
      browseState = { mode: 'general', page: 1, label: `Titre : ${parsed.literal_title}` };
      renderGrid();
      $('#perf').textContent = `Résultats titre pour "${parsed.literal_title}" (${grid.length})`;
      $('#msg').textContent = grid.length ? '' : 'Aucun résultat disponible.';
      return;
    }

    // 3. Critères thématiques (ex: "film francais annees 2000", "horreur coréenne")
    const params = {
      year_gte: parsed.year_gte,
      year_lte: parsed.year_lte,
      with_origin_country: parsed.with_origin_country
    };
    if (parsed.genres && parsed.genres.length) {
      const gIds = parsed.genres.map(g => TMDB_GENRES[g.toLowerCase()]).filter(Boolean);
      if (gIds.length) params.with_genres = gIds.join(',');
    }

    browseState = {
      mode: 'discover',
      page: 1,
      label: query,
      discoverParams: params
    };
    fetchNextBatch();

  } catch(e) {
    $('#msg').textContent = 'Erreur d\'analyse : ' + e.message;
  }
};

// ----------------- SUGGESTIONS CIBLÉES -----------------

const rnd = (a, k) => [...a].sort(() => Math.random() - .5).slice(0, k);

async function loadLLMSuggestions() {
  if (!hasKeys()) return;
  const sampleSeen = rnd(Object.values(S.seen), 30).map(f => `${f.o} (${f.y})`).join(', ');
  const prompt = `Films vus : ${sampleSeen || 'Aucun'}. Propose 8 suggestions variées : 3 réalisateurs, 2 acteurs stars, 3 filtres précis (pays, décennie, genre).`;

  const system = `Réponds UNIQUEMENT par JSON d'objets :
- type : "director"|"actor"|"filter"
- name : nom de la personne
- label : titre court
- desc : description
- genres : tableau parmi [action, aventure, animation, comédie, crime, documentaire, drame, famille, fantastique, histoire, horreur, musique, mystère, romance, science-fiction, thriller, guerre, western]
- country : code pays ISO (US, FR, KR, JP, IT, GB, etc.)
- year_gte : année début
- year_lte : année fin`;

  try {
    $('#suggestions-container').innerHTML = '<div style="color:var(--mu);font-size:12px">Génération des critères...</div>';
    const list = await callGemini(system, prompt, 0.8);
    const container = $('#suggestions-container');
    container.innerHTML = '';
    
    list.forEach(item => {
      const card = document.createElement('div');
      card.className = 'sug-card';
      card.innerHTML = `<b>${item.label}</b><span>${item.desc || ''}</span>`;
      card.onclick = () => {
        closeSidebar();
        selectFacet(item, card);
      };
      container.appendChild(card);
    });
  } catch(e) {
    $('#suggestions-container').innerHTML = `<div style="color:var(--mu);font-size:12px">Échec (${e.message})</div>`;
  }
}

async function selectFacet(facet, cardEl) {
  document.querySelectorAll('.sug-card').forEach(c => c.classList.remove('active'));
  if (cardEl) cardEl.classList.add('active');
  
  switchToExplore();
  record();

  if (facet.type === 'director' || facet.type === 'actor') {
    const person = await searchPerson(facet.name);
    if (!person) return alert(`Introuvable sur TMDB : ${facet.name}`);
    const credits = await fetchPersonCredits(person.id, facet.type);
    browseState = {
      mode: 'person',
      label: facet.label,
      personBuffer: credits
    };
  } else {
    const params = {
      year_gte: facet.year_gte,
      year_lte: facet.year_lte,
      with_origin_country: facet.country
    };
    if (facet.genres && facet.genres.length) {
      const gIds = facet.genres.map(g => TMDB_GENRES[g.toLowerCase()]).filter(Boolean);
      if (gIds.length) params.with_genres = gIds.join(',');
    }
    browseState = {
      mode: 'discover',
      page: 1,
      label: facet.label,
      discoverParams: params
    };
  }

  fetchNextBatch();
}

async function callGemini(system, prompt, temp = 0.7) {
  const mk = m => JSON.stringify({
    systemInstruction: { parts: [{ text: system }] },
    contents: [{ role: 'user', parts: [{ text: prompt }] }],
    generationConfig: { responseMimeType: 'application/json', temperature: temp,
      ...(m.startsWith('gemini-2.5') ? { thinkingConfig: { thinkingBudget: 0 } } : {}) }
  });
  let j, last, used;
  for (const m of MODELS) {
    try {
      const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent`, {
        method: 'POST', headers: { 'content-type': 'application/json', 'x-goog-api-key': keys.a }, body: mk(m)
      });
      j = await r.json();
      if (!j.error) { used = m; break; }
      last = j.error;
    } catch(e) {}
  }
  if (!used) throw new Error(last?.message || 'Erreur Gemini');
  const text = j.candidates[0].content.parts.filter(p => !p.thought).map(p => p.text).join('');
  return JSON.parse(text.match(/\[[\s\S]*\]|\{[\s\S]*\}/)[0]);
}

// ----------------- VUES LISTES (VUS / WATCHLIST) -----------------

function renderListView() {
  const isSeen = currentView === 'seen';
  const source = isSeen ? S.seen : S.watch;
  const listCards = $('#list-cards');
  listCards.innerHTML = '';

  const q = $('#list-search').value.toLowerCase().trim();
  const dec = $('#list-decade').value;
  const sort = $('#list-sort').value;

  let items = Object.values(source);

  if (q) items = items.filter(f => (f.t && f.t.toLowerCase().includes(q)) || (f.o && f.o.toLowerCase().includes(q)));

  if (dec) {
    if (dec === 'old') items = items.filter(f => +f.y < 1970);
    else items = items.filter(f => +f.y >= +dec && +f.y < +dec + 10);
  }

  items.sort((a, b) => {
    if (sort === 'year-desc') return (+b.y || 0) - (+a.y || 0);
    if (sort === 'year-asc') return (+a.y || 0) - (+b.y || 0);
    if (sort === 'alpha') return (a.t || '').localeCompare(b.t || '');
    return (b.addedAt || 0) - (a.addedAt || 0);
  });

  $('#perf').textContent = `${isSeen ? 'Films vus' : 'Watchlist'} : ${items.length} film(s) affiché(s) sur ${Object.keys(source).length}`;

  items.forEach(f => {
    const card = document.createElement('div');
    card.className = 'list-item';
    card.innerHTML = `
      <img id="img-${f.id}" src="${getPosterSrc(f)}" alt="" loading="lazy">
      <div class="list-item-body">
        <div>
          <div class="list-item-title">${f.t}</div>
          <div class="list-item-sub">${f.o !== f.t ? f.o + ' · ' : ''}${f.y}</div>
        </div>
        <div class="list-item-actions">
          <button class="btn-swap">${isSeen ? '→ À voir' : '→ Vu'}</button>
          <button class="btn-del" style="background:var(--bad);color:#fff">✕</button>
        </div>
      </div>
    `;

    card.querySelector('img').onclick = () => showMovieDetails(f.id);

    card.querySelector('.btn-swap').onclick = () => {
      if (isSeen) {
        delete S.seen[f.id];
        S.watch[f.id] = { ...f, addedAt: Date.now() };
      } else {
        delete S.watch[f.id];
        S.seen[f.id] = { ...f, addedAt: Date.now() };
      }
      save();
      renderListView();
    };

    card.querySelector('.btn-del').onclick = () => {
      delete (isSeen ? S.seen : S.watch)[f.id];
      save();
      renderListView();
    };

    listCards.appendChild(card);
  });
}

function switchToExplore() {
  currentView = 'explore';
  $('.nav-tab.active')?.classList.remove('active');
  $('#tab-explore').classList.add('active');
  $('#list-view').style.display = 'none';
  $('#grid').style.display = 'grid';
}

function switchToTab(view) {
  record();
  currentView = view;
  $('.nav-tab.active')?.classList.remove('active');
  if (view === 'seen') $('#tab-seen').classList.add('active');
  if (view === 'watch') $('#tab-watch').classList.add('active');

  $('#grid').style.display = 'none';
  $('#list-view').style.display = 'flex';
  renderListView();
}

$('#tab-explore').onclick = switchToExplore;
$('#tab-seen').onclick = () => switchToTab('seen');
$('#tab-watch').onclick = () => switchToTab('watch');
$('#list-search').oninput = renderListView;
$('#list-decade').onchange = renderListView;
$('#list-sort').onchange = renderListView;

// ----------------- RENDU DE LA GRILLE -----------------

function renderGrid() {
  $('#grid').innerHTML = '';
  grid.forEach(f => {
    const d = document.createElement('div');
    const paint = () => { d.className = 'c' + (f.sel ? ' sel' : '') + (f.wl ? ' w' : '') };
    d.innerHTML = `
      <img id="img-${f.id}" src="${getPosterSrc(f)}" alt="" loading="lazy">
      <span>${f.t} (${f.y})</span>
      <button class="wl">＋ à voir</button>
      <button class="btn-info" title="Détails du film">ℹ</button>
    `;
    paint();
    d.onclick = () => { f.sel = !f.sel; if (f.sel) f.wl = false; paint(); };
    d.querySelector('.wl').onclick = e => { e.stopPropagation(); f.wl = !f.wl; if (f.wl) f.sel = false; paint(); };
    d.querySelector('.btn-info').onclick = e => { e.stopPropagation(); showMovieDetails(f.id); };
    $('#grid').append(d);
  });
}

function record() {
  const now = Date.now();
  grid.forEach(f => {
    const o = { id: f.id, t: f.t, o: f.o, y: f.y, p: f.p, addedAt: now };
    delete S.seen[f.id]; delete S.unseen[f.id]; delete S.watch[f.id];
    if (f.sel) S.seen[f.id] = o;
    else if (f.wl) S.watch[f.id] = o;
    else S.unseen[f.id] = o;
  });
  save();
}

$('#hint').onkeydown = e => { if (e.key === 'Enter') $('#ask').click(); };
$('#gen-facets').onclick = loadLLMSuggestions;
$('#next').onclick = fetchNextBatch;

$('#all').onclick = () => {
  const on = !grid.every(f => f.sel);
  grid.forEach(f => { f.sel = on; if (on) f.wl = false; });
  renderGrid();
};

$('#sync-push').onclick = pushToGist;
$('#sync-pull').onclick = pullFromGist;

const dl = (name, text, type) => {
  const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(new Blob([text], { type })), download: name });
  a.click();
};

$('#btn-export-csv').onclick = () => {
  record();
  const rows = Object.values(S.seen).map(f => `${f.id},"${(f.o || f.t).replace(/"/g, '""')}",${f.y}`);
  if (!rows.length) return alert('Aucun film vu à exporter.');
  dl('letterboxd-vus.csv', 'tmdbID,Title,Year\n' + rows.join('\n'), 'text/csv');
};

$('#btn-export-json').onclick = () => {
  record();
  dl('session-films.json', JSON.stringify(S), 'application/json');
};

$('#btn-import-file').onclick = () => $('#file-input').click();
$('#file-input').onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;
  const txt = await f.text();
  try {
    if (f.name.endsWith('.json')) {
      const d = JSON.parse(txt);
      Object.assign(S.seen, d.seen || {});
      Object.assign(S.unseen, d.unseen || {});
      Object.assign(S.watch, d.watch || {});
    } else {
      const isWatchlist = /watch/i.test(f.name);
      txt.split(/\r?\n/).slice(1).forEach(l => {
        const m = l.match(/^(\d+),"((?:[^"]|"")*)",(\d*)/);
        if (m) {
          const t = m[2].replace(/""/g, '"');
          (isWatchlist ? S.watch : S.seen)[m[1]] = { id: +m[1], t, o: t, y: m[3] };
        }
      });
    }
    Object.keys(S.seen).concat(Object.keys(S.watch)).forEach(id => delete S.unseen[id]);
    save();
    closeKeyModal();
    renderGrid();
    alert(`Import réussi : ${Object.keys(S.seen).length} vus et ${Object.keys(S.watch).length} à voir.`);
  } catch(err) {
    alert('Fichier non valide.');
  }
};

$('#btn-reset-all').onclick = () => {
  if (confirm('Effacer toutes les données locales ?')) {
    S = { seen: {}, unseen: {}, watch: {} };
    grid = [];
    browseState = { mode: 'general', page: 1, label: 'Grille générale', discoverParams: null, personBuffer: [] };
    save();
    closeKeyModal();
    renderGrid();
  }
};

// Init
save();
if (keys.a && keys.t) {
  loadLLMSuggestions();
  fetchNextBatch();
} else {
  $('#msg').textContent = 'Clique sur « ⚙️ » pour configurer tes clés API.';
}
</script>
